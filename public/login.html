<!--
  ============================================================================
  File Name: login.html
  Author: Bonita Rodrigues
  Purpose: User authentication and login interface for the Texas Hold'em web 
             application. Collects credentials, submits them securely to the 
             backend login controller, and displays error messaging upon failure.
  ============================================================================
-->
 
<!DOCTYPE html>
<html>
    <head>
        <title>Texas Hold'em - Login</title>
        
        <!-- Bootstrap Library -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">        
        
        <!-- Your Custom External Stylesheet -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- Header / Jumbotron -->
        <div class="p-5 custom-jumbotron text-white text-center">
            <h1 class="display-5 fw-bold">Texas Hold'em Poker <span class="bi bi-suit-spade-fill"></span></h1>
            <p class="lead text-light opacity-75 mb-0">High Stakes & Strategic Play</p>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm custom-navbar" data-bs-theme="dark"> 
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html"><span class="bi-house-fill"></span> Home</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <br/>

        <!-- Main Content Container -->
        <div class="container my-5 auth-container">
            <!-- Floating Glowing Cards in the Background -->
            <div class="d-none d-lg-block">
                <!-- Ace of Spades (Left) -->
                <div class="falling-card card-left-ace">
                    <div class="card-rank">
                        A
                        <i class="bi bi-suit-spade-fill"></i>
                    </div>
                    <i class="bi bi-suit-spade-fill center-suit"></i>
                </div>

                <!-- King of Diamonds (Right) -->
                <div class="falling-card card-right-king">
                    <div class="card-rank">
                        K
                        <i class="bi bi-suit-diamond-fill"></i>
                    </div>
                    <i class="bi bi-suit-diamond-fill center-suit"></i>
                </div>

                <!-- Jack of Hearts (Lower Left) -->
                <div class="falling-card card-left-jack">
                    <div class="card-rank">
                        J
                        <i class="bi bi-suit-heart-fill"></i>
                    </div>
                    <i class="bi bi-suit-heart-fill center-suit"></i>
                </div>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">

                    <!-- Split Login Card -->
                    <div class="card login-card">
                        <div class="row g-0">
                            
                            <!-- Left Welcome Banner (Purple Gradient Side) -->
                            <div class="col-md-6 welcome-side">
                                <h1 class="display-4 fw-bold mb-3">Welcome Back.</h1>
                                <p class="lead opacity-90">
                                    Step up to the high-stakes table, manage your player stack, and take your seat in Texas Hold'em.
                                </p>
                            </div>

                            <!-- Right Form Area -->
                            <div class="col-md-6 form-side">
                                <h2 class="fw-bold mb-1">Login</h2>
                                <p class="text-muted small mb-4">
                                    Don't have an account? <a href="signup.html" class="text-decoration-none fw-semibold">Create Your Account</a>
                                </p>

                                <form class="was-validated" method="post" action="loginuser">

                                    <!-- Email Input (Updated to match backend txt_email) -->
                                    <div class="mb-4">
                                        <label for="txt_email" class="form-label text-muted small mb-1">Email</label>
                                        <input class="form-control input-line" type="email" name="txt_email" id="txt_email" placeholder="Enter email" required />
                                    </div>

                                    <!-- Password Input -->
                                    <div class="mb-4">
                                        <label for="txt_pass" class="form-label text-muted small mb-1">Password</label>
                                        <input class="form-control input-line" type="password" name="txt_pass" id="txt_pass" placeholder="Enter password" minlength="6" required />
                                    </div>

                                    <!-- Remember Me & Forgot Password -->
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe">
                                            <label class="form-check-label text-muted small" for="rememberMe">
                                                Remember me
                                            </label>
                                        </div>
                                        <a href="#" class="text-muted small text-decoration-none">Forgot password?</a>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="d-flex justify-content-between align-items-center pt-2">
                                        <button type="reset" class="btn btn-link text-muted text-decoration-none px-0">Clear</button>
                                        <button type="submit" class="btn btn-login-gradient">Login</button>
                                    </div>
                                </form>

                                <!-- Error Display Area -->
                                <div class="mt-3" id="msg-display"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-5 p-4 custom-footer text-white text-center">
            <p>Power Puff Girls Inc. -- CS Department</p>
        </div>

        <!-- Dynamic JS Script for URL error parameters -->
        <script src="login.js"></script>
    </body>

</html>
