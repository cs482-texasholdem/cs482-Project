<!--
  ============================================================================
  File Name: admin.html
  Author: Bonita Rodrigues
  Purpose: Admin Dashboard interface for the Texas Hold'em web application.
           Provides administrative views for user record management, role 
           assignments, chip balance adjustments, account deactivation, and 
           access-controlled navigation.
  ============================================================================
-->

<!DOCTYPE html>
<html>

    <head>
        <title>Texas Hold'em - Admin Dashboard</title>
        <!-- Bootstrap Library -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">        
        <!-- Custom Shared Stylesheet -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

         <!-- Header / Jumbotron -->
        <div class="p-5 custom-jumbotron text-white text-center">
            <h1 class="display-5 fw-bold">Texas Hold'em Poker <span class="bi bi-suit-spade-fill"></span></h1>
            <p class="lead text-light opacity-75 mb-0">High Stakes & Strategic Play</p>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm custom-navbar" data-bs-theme="dark"> 
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="landing.html"><span class="bi-house-fill"></span> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin.html"><span class="bi-shield-lock-fill"></span> Admin Console</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <br/>

        <!-- Main Admin Container -->
        <div class="container mt-4 mb-5">
            <div class="row mb-4">
                <div class="col">
                    <h2>Player Account Management</h2>
                    <p class="text-muted">Edit user details, update points, or disable accounts as needed.</p>
                </div>
            </div>

            <!-- Users Table Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4">Username</th>
                                    <th>Role</th>
                                    <th>Points / Chips</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- Dynamic rows will load here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit User Modal -->
        <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <form id="editUserForm" action="/user" method="POST">

                        <!-- Modal Header -->
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title" id="editUserModalLabel">Edit User Account</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <!-- Hidden ID field for backend update mapping -->
                            <input type="hidden" id="txt_id" name="txt_id">

                            <!-- All usernames from database-->
                            <div class="mb-3">
                                <label for="txt_login" class="form-label">Username</label>
                                <input type="text" class="form-control" id="txt_login" name="txt_login" required>
                            </div>

                            <!-- All permission roles from database -->
                            <div class="mb-3">
                                <label for="txt_perm" class="form-label">Permission Role (1 = Admin, 2 = Player)</label>
                                <input type="number" class="form-control" id="txt_perm" name="txt_perm" min="1" max="2" required>
                            </div>

                            <!-- Points field for the user -->
                            <div class="mb-3">
                                <label for="txt_points" class="form-label">Points </label>
                                <input type="number" class="form-control" id="txt_points" name="txt_points">
                            </div>

                            <!-- New password field for the user -->
                            <div class="mb-3">
                                <label for="txt_pass" class="form-label">New Password (leave blank to keep current)</label>
                                <input type="password" class="form-control" id="txt_pass" name="txt_pass" placeholder="Enter new password if changing">
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-5 p-4 custom-footer text-white text-center">
            <p>Powerpuff Girls Inc. -- CS Department</p>
        </div>

        <!-- Dynamic Data Fetching and Management Script -->
        <script src="admin.js"></script>
        
    </body>
</html>
