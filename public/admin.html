<!DOCTYPE html>
<html>
    <head>
        <title>Texas Hold'em - Admin Dashboard</title>
        <!-- Bootstrap Library -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">        
        <!-- Custom Shared Stylesheet -->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="bg-light">

        <!-- Header / Jumbotron -->
        <div class="p-4 bg-primary text-white text-center"> 
          <h1>Texas Hold'em Poker <span class="bi bi-suit-spade-fill"></span></h1>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm custom-navbar" data-bs-theme="dark"> 
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="landing.html"><span class="bi-house-fill"></span> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin.html"><span class="bi-shield-lock-fill"></span> Admin Console</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <br/>

        <!-- Main Admin Container -->
        <div class="container mt-4 mb-5">
            <div class="row mb-4">
                <div class="col">
                    <h2>Player Account Management</h2>
                    <p class="text-muted">Edit user details, reset passwords, or disable accounts as needed.</p>
                </div>
            </div>

            <!-- Users Table Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4">Username</th>
                                    <th>Role</th>
                                    <th>Chip Balance</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Example Row (Dynamic data will populate here from your controller) -->
                                <tr>
                                    <td class="ps-4 fw-semibold">PokerFace99</td>
                                    <td><span class="badge bg-secondary">PLAYER</span></td>
                                    <td>$10,500</td>
                                    <td><span class="badge bg-success">Active</span></td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-primary me-1" title="Edit Info"><i class="bi bi-pencil"></i></button>
                                        <button class="btn btn-sm btn-outline-warning me-1" title="Reset Password"><i class="bi bi-key"></i></button>
                                        <button class="btn btn-sm btn-outline-danger" title="Disable Account"><i class="bi bi-ban"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-5 p-4 custom-footer text-white text-center">
            <p>Powerpuff Girls Inc. -- CS Department</p>
        </div>
        
    </body>
</html>
